<meta charset="utf-8">
<title>Falô English</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Falô English: app de inglês falado, pensado para o celular.
   Identidade: roxo-tucano (marca), laranja-bico (ação), amarelo-sol (recompensa), verde-menta (acerto), coral (erro).
   Layout: uma coluna de app (até 440px) com barra de abas embaixo; no computador aparece como um celular no centro. */
:root{
  --bg:#F4F1FF; --card:#FFFFFF; --ink:#1B1740; --mut:#6C6894; --line:#E3DEFA; --soft:#ECE8FF;
  --pri:#6B4EFF; --pri-d:#4A33C9; --pri-bg:#E9E4FF;
  --bico:#FF9F1C; --bico-d:#D97E00; --sol:#FFD23F; --sol-d:#E0AB00;
  --ok:#17B67A; --ok-d:#0E8F5E; --ok-bg:#DDF7EC;
  --bad:#FF5470; --bad-d:#D93553; --bad-bg:#FFE3E8;
  --sky:#3BB8FF; --shadow:0 10px 30px rgba(60,40,160,.14);
  --f-d:'Fredoka','Trebuchet MS',system-ui,sans-serif; --f-b:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --hero:linear-gradient(160deg,#7A5CFF 0%,#5B3FF0 55%,#4A33C9 100%);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F0D26; --card:#1A1740; --ink:#F2EFFF; --mut:#A6A1D6; --line:#2C2766; --soft:#241F55;
  --pri:#8C75FF; --pri-d:#6B4EFF; --pri-bg:#2B2468; --ok-bg:#12382E; --bad-bg:#46202B; --shadow:0 10px 30px rgba(0,0,0,.4);
  --hero:linear-gradient(160deg,#5B3FF0 0%,#3F2BB5 60%,#2E1F8A 100%); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0D26; --card:#1A1740; --ink:#F2EFFF; --mut:#A6A1D6; --line:#2C2766; --soft:#241F55;
  --pri:#8C75FF; --pri-d:#6B4EFF; --pri-bg:#2B2468; --ok-bg:#12382E; --bad-bg:#46202B; --shadow:0 10px 30px rgba(0,0,0,.4);
  --hero:linear-gradient(160deg,#5B3FF0 0%,#3F2BB5 60%,#2E1F8A 100%); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.45 var(--f-b);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.stage{height:100%;display:flex;align-items:center;justify-content:center;background:
  radial-gradient(900px 500px at 10% 0%,rgba(107,78,255,.18),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(255,159,28,.16),transparent 60%),var(--bg)}
.app{position:relative;width:100%;max-width:440px;height:100%;max-height:900px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:520px){.app{height:min(880px,96%);border-radius:38px;box-shadow:0 30px 80px rgba(40,20,140,.28);border:1px solid var(--line)}}
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px));scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
h1,h2,h3{font-family:var(--f-d);font-weight:700;margin:0;line-height:1.15;text-wrap:balance}
.ico{display:inline-flex}.ico svg{display:block}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;font-family:var(--f-d);font-weight:600;font-size:15px;background:var(--card);box-shadow:0 2px 0 var(--line);border:1.5px solid var(--line)}
.pill.fire{color:var(--bico-d)}.pill.xp{color:var(--sol-d)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:max(14px,env(safe-area-inset-top,0px)) 0 10px}
.brand{font-family:var(--f-d);font-weight:700;font-size:22px;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
.logo{width:32px;height:32px;border-radius:11px;background:var(--pri);color:#fff;display:grid;place-items:center;box-shadow:0 3px 0 var(--pri-d)}
.snd{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--card);border:1.5px solid var(--line);color:var(--mut)}

/* herói */
.hero{position:relative;border-radius:28px;padding:18px 18px 16px;background:var(--hero);color:#fff;box-shadow:0 14px 34px rgba(91,63,240,.35);overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero .row{display:flex;gap:12px;align-items:flex-end;position:relative;z-index:1}
.bubble{position:relative;background:#fff;color:#1B1740;border-radius:18px 18px 18px 6px;padding:11px 14px;font-weight:700;font-size:15px;line-height:1.35;flex:1;min-width:0}
.hero .tag{font-family:var(--f-d);font-weight:600;font-size:13px;letter-spacing:.6px;text-transform:uppercase;opacity:.85;margin:14px 0 2px;position:relative;z-index:1}
.hero h2{font-size:25px;position:relative;z-index:1}
.bar{height:14px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden;margin:12px 0 0;position:relative;z-index:1}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--sol),#FFF2A8);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.barlab{display:flex;justify-content:space-between;font-size:13px;opacity:.9;margin-top:6px;position:relative;z-index:1}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;padding:14px 20px;border-radius:20px;font-family:var(--f-d);font-weight:700;font-size:19px;letter-spacing:.3px;text-transform:uppercase;transition:transform .08s,box-shadow .08s}
.btn.go{background:var(--bico);color:#fff;box-shadow:0 5px 0 var(--bico-d)}
.btn.go:active{transform:translateY(4px);box-shadow:0 1px 0 var(--bico-d)}
.btn.ok{background:var(--ok);color:#fff;box-shadow:0 5px 0 var(--ok-d)}.btn.ok:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ok-d)}
.btn.bad{background:var(--bad);color:#fff;box-shadow:0 5px 0 var(--bad-d)}.btn.bad:active{transform:translateY(4px);box-shadow:0 1px 0 var(--bad-d)}
.btn.off{background:var(--soft);color:var(--mut);box-shadow:0 5px 0 var(--line);pointer-events:none}
.btn.ghost{background:var(--card);color:var(--pri);box-shadow:0 4px 0 var(--line);border:1.5px solid var(--line);font-size:16px;min-height:50px}
.hero .btn{margin-top:14px;position:relative;z-index:1}

.goal{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:24px;padding:14px 16px;margin-top:16px;box-shadow:var(--shadow);border:1.5px solid var(--line)}
.ring{position:relative;width:66px;height:66px;flex:none}.ring svg{display:block;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-d);font-size:17px}
.goal h3{font-size:18px}.goal p{margin:2px 0 0;color:var(--mut);font-size:14px}
.sec{font-family:var(--f-d);font-size:20px;margin:22px 2px 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec small{font:700 13px var(--f-b);color:var(--mut)}

/* trilha */
.trail{position:relative;padding:6px 0 4px}
.node{display:flex;align-items:center;gap:14px;margin:0 0 6px;position:relative}
.node.r{flex-direction:row-reverse;text-align:right}
.orb{position:relative;flex:none;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.orb.done{background:var(--ok);box-shadow:0 6px 0 var(--ok-d)}
.orb.now{background:var(--pri);box-shadow:0 6px 0 var(--pri-d);width:76px;height:76px}
.orb.lock{background:var(--soft);color:var(--mut);box-shadow:0 6px 0 var(--line)}
.orb.now::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid var(--pri);opacity:.35;animation:halo 1.8s ease-out infinite}
@keyframes halo{0%{transform:scale(.88);opacity:.55}100%{transform:scale(1.25);opacity:0}}
.node .lab{font-family:var(--f-d);font-weight:600;font-size:17px}.node .lab small{display:block;font:700 13px var(--f-b);color:var(--mut)}
.node.m1{padding-left:0}.node.m2{padding-left:44px}.node.m3{padding-left:70px}
.node.r.m1{padding-right:44px}.node.r.m2{padding-right:70px}
.start{display:block;width:max-content;max-width:100%;background:var(--bico);color:#fff;font-family:var(--f-d);font-weight:700;font-size:13px;letter-spacing:.8px;padding:4px 10px;border-radius:10px;margin-bottom:4px;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}

/* abas */
.tabs{display:flex;gap:4px;padding:8px 12px max(10px,env(safe-area-inset-bottom,0px));background:var(--card);border-top:1.5px solid var(--line)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:16px;color:var(--mut);font-family:var(--f-d);font-weight:600;font-size:13px;position:relative}
.tab.on{color:var(--pri);background:var(--pri-bg)}

/* lição */
.lh{display:flex;align-items:center;gap:12px;padding:max(14px,env(safe-area-inset-top,0px)) 0 8px}
.x{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--mut);background:var(--card);border:1.5px solid var(--line);flex:none}
.segs{flex:1;display:flex;gap:6px}.segs i{flex:1;height:14px;border-radius:99px;background:var(--soft);overflow:hidden;position:relative}
.segs i b{position:absolute;inset:0;transform:scaleX(0);transform-origin:left;background:var(--ok);border-radius:99px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.14)}
.combo{display:inline-flex;align-items:center;gap:6px;color:var(--bico-d);font-family:var(--f-d);font-weight:700;font-size:14px;opacity:0}
.kind{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-d);font-weight:600;font-size:13px;letter-spacing:.7px;text-transform:uppercase;color:var(--pri);margin:10px 0 6px}
.q{font-family:var(--f-d);font-weight:700;font-size:26px;line-height:1.2;margin:6px 0 14px;text-wrap:balance}
.scene{display:flex;gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:12px 14px;margin:0 0 14px;box-shadow:0 3px 0 var(--line)}
.scene .pic{flex:none;width:54px;height:54px;border-radius:16px;background:linear-gradient(160deg,#FFD23F,#FF9F1C);display:grid;place-items:center;color:#fff}
.scene p{margin:0;font-size:15px;line-height:1.35}.scene b{font-family:var(--f-d)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 16px;margin:0 0 12px;border-radius:20px;background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-family:var(--f-d);font-weight:600;font-size:20px;transition:transform .08s,box-shadow .08s,border-color .15s,background .15s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt .k{flex:none;width:32px;height:32px;border-radius:11px;display:grid;place-items:center;border:2px solid var(--line);font-size:14px;color:var(--mut)}
.opt.sel{border-color:var(--pri);background:var(--pri-bg);box-shadow:0 4px 0 var(--pri)}
.opt.sel .k{border-color:var(--pri);background:var(--pri);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 4px 0 var(--ok);color:var(--ok-d)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 4px 0 var(--bad);color:var(--bad-d)}
.opt[disabled]{pointer-events:none}
.dock{padding:12px max(16px,env(safe-area-inset-left,0px)) max(14px,env(safe-area-inset-bottom,0px));border-top:1.5px solid var(--line);background:var(--bg)}

/* ligações */
.pairs{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px 38px;margin-top:8px}
.pairs button{min-height:60px;padding:10px;border-radius:18px;background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-family:var(--f-d);font-weight:600;font-size:18px;line-height:1.2;transition:background .15s,border-color .15s}
.pairs button.sel{border-color:var(--pri);background:var(--pri-bg);box-shadow:0 4px 0 var(--pri)}
.pairs button.hit{border-color:var(--ok);background:var(--ok-bg);color:var(--ok-d);box-shadow:none;pointer-events:none}
.pairs button.miss{border-color:var(--bad);background:var(--bad-bg);color:var(--bad-d);box-shadow:0 4px 0 var(--bad)}
.plines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:2}
.pl{fill:none;stroke-width:5;stroke-linecap:round}.pl.ok{stroke:var(--ok)}.pl.bad{stroke:var(--bad)}
.warn{display:none;align-items:center;gap:10px;background:var(--sol);color:#4A3600;border-radius:16px;padding:10px 14px;font-family:var(--f-d);font-weight:600;margin:0 0 6px}
.warn.on{display:flex}

/* letras */
.hint{font-family:var(--f-d);font-size:22px;letter-spacing:3px;color:var(--mut);text-align:center;min-height:34px;margin:2px 0 8px}
.slot,.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:14px;border-radius:22px;min-height:80px;align-content:center}
.slot{border:2.5px dashed var(--line);background:var(--card)}.bank{background:var(--soft);margin-top:12px}
.lt{width:52px;height:56px;border-radius:16px;background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-family:var(--f-d);font-weight:700;font-size:26px;display:grid;place-items:center}
.lt.okl{background:var(--ok-bg);border-color:var(--ok);box-shadow:0 4px 0 var(--ok);color:var(--ok-d)}
.lt.badl{background:var(--bad-bg);border-color:var(--bad);box-shadow:0 4px 0 var(--bad);color:var(--bad-d)}
.mini{display:flex;gap:10px;margin-top:12px}.mini .btn{min-height:46px;font-size:14px}

/* microfone */
.say{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:14px 16px;box-shadow:0 3px 0 var(--line);margin:0 0 6px}
.say .w{display:flex;flex-wrap:wrap;gap:6px;font-family:var(--f-d);font-weight:600;font-size:25px;margin-top:6px}
.say .w span{padding:2px 8px;border-radius:10px;transition:background .2s,color .2s}
.say .w span.y{background:var(--ok-bg);color:var(--ok-d)}.say .w span.n{background:var(--bad-bg);color:var(--bad-d)}
.micwrap{display:flex;flex-direction:column;align-items:center;gap:12px;margin:22px 0 6px}
.mic{position:relative;width:104px;height:104px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;box-shadow:0 7px 0 var(--pri-d)}
.mic.live{background:var(--bad);box-shadow:0 7px 0 var(--bad-d)}
.mic.live::before,.mic.live::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--bad);animation:halo 1.4s ease-out infinite}
.mic.live::after{animation-delay:.7s}
.wave{display:flex;align-items:center;gap:5px;height:44px}.wave i{display:block;width:6px;height:8px;border-radius:6px;background:var(--pri)}
.cap{color:var(--mut);font-size:14px;text-align:center}

/* feedback */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:30;padding:16px max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-bottom,0px));border-radius:28px 28px 0 0;box-shadow:0 -12px 36px rgba(0,0,0,.18)}
.sheet.ok{background:var(--ok-bg);color:var(--ok-d)}.sheet.bad{background:var(--bad-bg);color:var(--bad-d)}
.sheet .st{display:flex;gap:12px;align-items:center}
.sheet h3{font-size:23px}.sheet p{margin:3px 0 0;font-size:15px;color:var(--ink);font-weight:700}.sheet p small{color:var(--mut);font-weight:700}
.sheet .btn{margin-top:14px}
.sheet .mini-m{flex:none;width:62px;height:62px}
.toast{position:absolute;left:50%;top:78px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:99px;font-family:var(--f-d);font-weight:600;font-size:14px;z-index:40;opacity:0;pointer-events:none;white-space:nowrap}

/* resultado */
.res{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:26px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin:18px 0}
.stat{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 6px;box-shadow:0 4px 0 var(--line)}
.stat small{display:block;font:800 11px var(--f-b);letter-spacing:.8px;text-transform:uppercase;color:var(--mut)}
.stat b{display:flex;align-items:center;justify-content:center;gap:4px;font-family:var(--f-d);font-size:25px;margin-top:2px}
.stat.s1{border-color:var(--sol)}.stat.s1 b{color:var(--sol-d)}.stat.s2{border-color:var(--ok)}.stat.s2 b{color:var(--ok)}.stat.s3{border-color:var(--bico)}.stat.s3 b{color:var(--bico-d)}
.mascot{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="stage"><div class="app" id="app">
  <div class="view" id="view"></div>
  <nav class="tabs" id="tabs" aria-label="Seções"></nav>
  <div class="toast" id="toast"></div>
</div></div>
