<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f55d9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Estudo de inglês</title>
<style>
:root{
  --bg:#eef1f6;--card:#fff;--soft:#f4f6fa;--ink:#131c2e;--mut:#5d6b82;--line:#dfe5ee;
  --pri:#1f55d9;--pri2:#1946b8;--on:#fff;--blue:#1f55d9;--blue-bg:#e6eeff;
  --ok:#12804a;--ok-bg:#dff5e8;--bad:#c2372d;--bad-bg:#fde9e6;--warn:#8a5a00;--warn-bg:#fff1cc;--amber:#e3a008;
  --sh:0 1px 2px rgba(19,28,46,.05),0 6px 18px rgba(19,28,46,.06);--r:20px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b1016;--card:#151c27;--soft:#1b2431;--ink:#ecf0f7;--mut:#98a6bb;--line:#263142;
  --pri:#3a6cf0;--pri2:#2f5bd0;--on:#fff;--blue:#8fb4ff;--blue-bg:#182a4d;
  --ok:#5ed38d;--ok-bg:#12301f;--bad:#ff8d83;--bad-bg:#3b1d1a;--warn:#f3c466;--warn-bg:#3a2d0f;--amber:#f3c466;
  --sh:0 1px 2px rgba(0,0,0,.45);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;cursor:pointer;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:12px 18px;min-height:52px;text-align:center;transition:transform .08s,background .15s,border-color .15s,box-shadow .15s}
button:active{transform:scale(.97)}
button:focus-visible,select:focus-visible,input:focus-visible,.tr:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button[disabled]{opacity:.5;cursor:default}
.ico{display:inline-flex;flex:none}.ico svg{display:block}
h1,h2,h3,p{margin:0}
h2{font-size:22px;line-height:1.25;letter-spacing:-.02em;margin-bottom:8px}
h3{font-size:12.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.09em;font-weight:800;margin:22px 0 8px}
p{margin-bottom:10px}
.mut{color:var(--mut)}.small{font-size:14px;color:var(--mut)}
.primary{background:var(--pri);border-color:var(--pri);color:var(--on);font-weight:700;box-shadow:0 3px 0 var(--pri2)}
.primary:active{box-shadow:0 1px 0 var(--pri2)}
.wide{width:100%}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.actions>button{flex:1 1 140px}

/* barras */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 8px 0;background:var(--bg)}
.top button{width:44px;min-height:44px;height:44px;padding:0;border:0;border-radius:50%;background:var(--card);box-shadow:var(--sh)}
.top .ttl{flex:1;min-width:0;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;letter-spacing:-.01em}
.top .sp{width:44px}
.home .top{display:none}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;flex-direction:column;gap:2px;border:0;border-radius:0;background:transparent;min-height:60px;font-size:12px;font-weight:700;color:var(--mut);box-shadow:none}
.tabs button.on{color:var(--blue)}
.tabs button.on .ico{background:var(--blue-bg);border-radius:99px;padding:3px 18px}
.tabs .ico{padding:3px 18px}
.playing .tabs,.locked .tabs{display:none}
main{max-width:600px;margin:0 auto;padding:8px 16px calc(96px + env(safe-area-inset-bottom))}
.home main{padding-top:0}
.playing main{padding-bottom:28px}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
main>*{animation:up .28s ease both}
main>*:nth-child(2){animation-delay:.04s}main>*:nth-child(3){animation-delay:.08s}main>*:nth-child(n+4){animation-delay:.11s}

/* blocos */
.card{background:var(--card);border-radius:var(--r);padding:18px;margin:0 0 14px;box-shadow:var(--sh);counter-reset:o}
.card>h3:first-child{margin-top:0}
.tag{display:inline-block;font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--blue-bg);color:var(--blue);letter-spacing:.06em;text-transform:uppercase}
.tag.g{background:var(--warn-bg);color:var(--warn)}.tag.ok{background:var(--ok-bg);color:var(--ok)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--pri);transition:width .35s}
.bar.ok i{background:var(--ok)}
select,input[type=text]{font:inherit;color:var(--ink);background:var(--soft);border:2px solid var(--line);border-radius:16px;padding:14px;width:100%;min-width:0}
input[type=text]{font-size:20px;font-weight:600}
input[type=text]:focus{border-color:var(--pri);outline:0}

/* início */
.hero{background:var(--pri);color:#fff;margin:0 -16px 0;padding:calc(22px + env(safe-area-inset-top)) 20px 74px;border-radius:0 0 30px 30px}
.hero .k{font-size:12.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.hero h1{font-size:28px;line-height:1.15;letter-spacing:-.025em;margin-top:6px}
.hero .row2{display:flex;align-items:center;gap:14px;margin-top:16px}
.hero .row2 .t{flex:1;min-width:0;font-size:15px;line-height:1.4;opacity:.92}
.hero .row2 .t b{display:block;font-size:17px}
.ring{position:relative;display:block;width:64px;height:64px;flex:none}.ring svg{display:block;width:100%;height:100%}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px}
.ring.big{width:120px;height:120px;margin:4px auto 12px}.ring.big b{font-size:28px}
.cta{margin-top:-54px}
.cta h2{margin-top:10px}
.cta .primary{margin-top:6px;font-size:18px;min-height:56px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 14px}
.quick button{flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border:0;border-radius:var(--r);box-shadow:var(--sh);text-align:left;min-height:96px}
.quick b{display:block;line-height:1.25}.quick .small{display:block;line-height:1.3;margin-top:2px}
.qi{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--blue-bg);color:var(--blue)}
.qi.g{background:var(--warn-bg);color:var(--warn)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 4px 10px}
.sec h3{margin:0}

/* trilha (unidades e etapas) */
.path{position:relative}
.node{position:relative;display:flex;gap:14px;align-items:center;width:100%;text-align:left;margin:0;padding:9px 10px 9px 6px;border:0;border-radius:18px;background:transparent;min-height:66px;box-shadow:none}
.node::before{content:"";position:absolute;left:28px;top:50%;height:100%;width:3px;background:var(--line);border-radius:3px}
.node:last-child::before{display:none}
.node.done::before{background:var(--ok)}
.nb{position:relative;z-index:1;flex:none;width:46px;height:46px;border-radius:50%;background:var(--card);border:3px solid var(--line);color:var(--mut);font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center}
.nb.g{width:34px;height:34px;margin:0 6px;font-size:13px;border-color:var(--amber);color:var(--warn);background:var(--warn-bg)}
.node.done .nb{background:var(--ok);border-color:var(--ok);color:#fff}
.node.next{background:var(--card);box-shadow:var(--sh)}
.node.next .nb{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 0 0 6px var(--blue-bg)}
.node .ut{flex:1;min-width:0}
.node .k{display:block;font-size:11.5px;font-weight:800;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.node .t{display:block;font-weight:700;line-height:1.3}
.node .d{display:block;font-size:14px;color:var(--mut);line-height:1.35}
.node>.ico{color:var(--mut)}
.pill{flex:none;font-size:12px;font-weight:800;background:var(--pri);color:#fff;border-radius:99px;padding:4px 11px}
.frac{flex:none;font-size:13px;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums}

/* mensagens e textos de estudo */
.msg{border-radius:16px;padding:13px 15px;margin:14px 0 0}
.msg.ok{background:var(--ok-bg);color:var(--ok)}.msg.bad{background:var(--bad-bg);color:var(--bad)}.msg.warn{background:var(--warn-bg);color:var(--warn)}.msg.info{background:var(--blue-bg);color:var(--ink)}
.note{display:flex;gap:12px;background:var(--blue-bg);border-radius:var(--r);padding:14px 16px;margin:0 0 14px}
.note .av{flex:none;width:36px;height:36px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center}
.note .tx{flex:1;min-width:0}.note .tx b.k{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin-bottom:2px}
.en{font-size:27px;line-height:1.25;font-weight:800;color:var(--blue);margin:0 0 8px;letter-spacing:-.02em}
.big{font-size:24px;line-height:1.3;font-weight:800;margin:0 0 14px;letter-spacing:-.015em}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin:0 0 8px;padding:12px 14px;border-radius:16px;background:var(--soft);border:0;min-height:58px}
.row .a{flex:1;min-width:0}.row .a b{color:var(--blue);display:block;font-size:18px;line-height:1.3}.row .a span{display:block;color:var(--mut);font-size:15px;line-height:1.35}
.row .a i{display:block;font-style:normal;font-size:14px;color:var(--ink);margin-top:3px}
.row .sp{flex:none;color:var(--blue)}
.formula{font-family:ui-monospace,Consolas,monospace;font-size:16px;background:var(--soft);border:1.5px dashed var(--line);border-radius:14px;padding:12px 14px;margin:0 0 10px;white-space:pre-wrap}
.cmp{border-left:4px solid var(--amber);background:var(--warn-bg);border-radius:0 14px 14px 0;padding:12px 14px;margin:0 0 10px}
.hook{border-left:4px solid var(--pri);background:var(--blue-bg);border-radius:0 14px 14px 0;padding:12px 14px;margin:0 0 10px}
.err{background:var(--soft);border-radius:16px;padding:12px 14px;margin:0 0 10px;counter-reset:o}
.err .l{display:flex;gap:8px;align-items:flex-start;margin-bottom:4px}
.err .x{color:var(--bad);text-decoration:line-through}.err .v{color:var(--ok);font-weight:700}
.err .l .ico{margin-top:3px}.err .l.bad .ico{color:var(--bad)}.err .l.good .ico{color:var(--ok)}
.tr{border-bottom:2px dotted var(--blue);cursor:pointer;color:var(--blue);font-weight:600}
.bubble{position:fixed;z-index:30;max-width:270px;background:#131c2e;color:#fff;font-size:15px;line-height:1.35;padding:9px 13px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.dots{display:flex;gap:6px;justify-content:center;margin:0 0 14px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--pri);width:22px;border-radius:8px}.dots i.past{background:var(--ok)}

/* treino */
.qhead{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.qhead .bar{flex:1;margin:0;height:10px}
.qhead .frac{font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);background:var(--blue-bg);border-radius:99px;padding:5px 12px 5px 9px;margin:0 0 12px}
.opt{display:flex;justify-content:flex-start;gap:12px;width:100%;text-align:left;margin:0 0 10px;padding:14px;border-radius:16px;background:var(--card);border:2px solid var(--line);box-shadow:0 2px 0 var(--line);counter-increment:o;font-weight:600}
.opt::before{content:counter(o,upper-alpha);flex:none;width:30px;height:30px;border-radius:10px;background:var(--soft);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;color:var(--mut)}
.opt[disabled]{opacity:.6}.opt[disabled].right,.opt[disabled].wrong{opacity:1}
.opt.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);box-shadow:none}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);box-shadow:none}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:62px;padding:10px;border-radius:16px;margin:8px 0;align-content:flex-start}
.tiles.slot{border:2px dashed var(--line);min-height:120px}.tiles.slot.over{border-color:var(--pri);background:var(--blue-bg)}
.tiles.bank{background:var(--soft)}
.tile{padding:9px 15px;min-height:46px;font-size:18px;font-weight:600;border-radius:13px;box-shadow:0 2px 0 var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.tile.on{background:var(--blue-bg);border-color:var(--pri);color:var(--blue);box-shadow:0 2px 0 var(--pri)}
.tile.lift{opacity:.25}
.ghost{position:fixed;z-index:40;pointer-events:none;margin:0;transform:scale(1.06) rotate(-2deg);box-shadow:0 10px 24px rgba(0,0,0,.25)}
.gapline{font-size:23px;font-weight:800;line-height:1.7;margin:0 0 14px;letter-spacing:-.01em}
.blank{display:inline-block;min-width:92px;min-height:42px;vertical-align:middle;border:2px dashed var(--pri);border-radius:12px;padding:0 12px;color:var(--blue);background:var(--blue-bg);text-align:center}
.blank.over{background:var(--pri);color:#fff}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs button{min-height:56px;padding:10px;font-weight:600;line-height:1.25;border-width:2px;box-shadow:0 2px 0 var(--line)}
.pairs button.sel{border-color:var(--pri);background:var(--blue-bg);color:var(--blue)}
.pairs button.hit{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);opacity:.75;box-shadow:none}
.pairs button.miss{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.micwrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin:18px 0 6px}
.mic{width:96px;height:96px;min-height:96px;padding:0;border-radius:50%;border:0;background:var(--pri);color:#fff;box-shadow:0 5px 0 var(--pri2)}
.mic:active{box-shadow:0 2px 0 var(--pri2)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,85,217,.45)}100%{box-shadow:0 0 0 26px rgba(31,85,217,0)}}
.mic.live{background:var(--bad);animation:pulse 1.1s ease-out infinite}
.miclab{font-weight:700;color:var(--mut);min-height:26px;text-align:center}
.heard{min-height:28px;text-align:center;color:var(--mut);font-style:italic}
.wm{font-size:22px;font-weight:800;line-height:1.5;margin:6px 0}
.wm span{border-radius:8px;padding:1px 5px;margin-right:3px;display:inline-block}
.wm .s{background:var(--warn-bg);color:var(--warn)}.wm .y{background:var(--ok-bg);color:var(--ok)}.wm .n{background:var(--bad-bg);color:var(--bad)}.wm .p{background:var(--blue-bg);color:var(--blue)}
.wm.live{font-size:21px;min-height:40px;margin:12px 0 0}
.livehint{font-size:13px;color:var(--mut);margin:8px 0 0}
input[type=text].good{border-color:var(--ok);background:var(--ok-bg)}
.srow{display:flex;gap:10px;align-items:center;width:100%;margin:0 0 10px;padding:12px;border-radius:18px;background:var(--soft);border:2px solid transparent}
.srow .a{flex:1;min-width:0}.srow .a b{display:block;color:var(--blue);font-size:19px;line-height:1.3}.srow .a span{display:block;color:var(--mut);font-size:15px;line-height:1.35}
.srow .a i{display:block;font-style:normal;font-size:14px;margin-top:3px}.srow .a em{display:block;font-style:normal;font-size:14px;margin-top:4px;font-weight:600}
.srow .bt{flex:none;width:50px;height:50px;min-height:50px;padding:0;border-radius:50%;box-shadow:0 2px 0 var(--line)}
.srow .bt.mic{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 3px 0 var(--pri2)}
.srow .bt.mic.live{background:var(--bad);border-color:var(--bad);animation:pulse 1.1s ease-out infinite}
.srow.ok{background:var(--ok-bg);border-color:var(--ok)}.srow.ok .a b,.srow.ok .a em{color:var(--ok)}
.srow.ok.soft{background:var(--warn-bg);border-color:var(--amber)}.srow.ok.soft .a b,.srow.ok.soft .a em{color:var(--warn)}
.srow.bad{background:var(--bad-bg);border-color:var(--bad)}
button.cal{min-height:40px;padding:6px 12px;font-size:14px;border-style:dashed;color:var(--ink);background:transparent}.srow.bad .a b,.srow.bad .a em{color:var(--bad)}
.srow .acts{display:flex;gap:8px;margin-top:8px}.srow .acts button{min-height:40px;padding:6px 12px;font-size:14px}
.score{display:flex;gap:8px;margin:0 0 12px;font-size:14px;font-weight:700}.score span{border-radius:99px;padding:4px 12px}
.score .y{background:var(--ok-bg);color:var(--ok)}.score .n{background:var(--bad-bg);color:var(--bad)}.score .z{background:var(--soft);color:var(--mut)}
textarea{font:inherit;color:var(--ink);background:var(--soft);border:2px solid var(--line);border-radius:16px;padding:12px;width:100%;min-height:90px;font-size:14px}
.ctxline{background:var(--soft);border-radius:14px;padding:10px 14px;margin:0 0 12px}
.ctxline b{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.bub{max-width:88%;padding:11px 14px;border-radius:20px 20px 20px 6px;margin:0 0 10px;text-align:left;display:block;border:0;background:var(--soft);box-shadow:none}
.bub.me{background:var(--blue-bg);margin-left:auto;border-radius:20px 20px 6px 20px}
.bub b{display:block;font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.bub .pt{display:none;color:var(--mut);font-size:15px}.showpt .bub .pt{display:block}

/* resposta (folha de baixo) */
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;max-height:72vh;overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom));border-radius:26px 26px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);animation:sheet .22s ease both}
.sheet>div{max-width:568px;margin:0 auto}
.sheet.ok{background:var(--ok-bg);color:var(--ok)}.sheet.bad{background:var(--bad-bg);color:var(--bad)}
.sheet .st{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800;letter-spacing:-.01em;margin-bottom:6px}
.sheet .st .ico{width:34px;height:34px;border-radius:50%;align-items:center;justify-content:center;color:#fff}
.sheet.ok .st .ico{background:var(--ok)}.sheet.bad .st .ico{background:var(--bad)}
.sheet .sb{color:var(--ink);font-size:16px}
.sheet .sb .ln{margin:3px 0}
.sheet button{width:100%;margin-top:14px;border:0;color:#fff;font-weight:800;font-size:17px}
.sheet.ok button{background:var(--ok);box-shadow:0 3px 0 rgba(0,0,0,.25)}.sheet.bad button{background:var(--bad);box-shadow:0 3px 0 rgba(0,0,0,.25)}
@media (prefers-color-scheme:dark){.sheet button{color:#0b1016}.sheet .st .ico{color:#0b1016}}
.center{text-align:center}
@media (prefers-reduced-motion:reduce){main>*,.sheet{animation:none}.mic.live{animation:none}button,.bar i{transition:none}}

</style>
</head>
<body>
<header class="top">
  <button id="back" type="button" aria-label="Voltar"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="ttl" id="ttl">Estudo de inglês</div>
  <span class="sp"></span>
</header>
<main id="app"></main>
<nav class="tabs" aria-label="Menu">

    if (!url) { res.replaceChildren(h('div', { class: 'msg warn' }, err === 'not-allowed' ? 'O navegador bloqueou o microfone. Libere o microfone para este site.' : 'Não consegui gravar. Tente de novo.'), h('div', { class: 'actions' }, btn('Escrever esta frase', toWrite, '', 'pencil'))); return; }

    res.replaceChildren(h('div', { class: 'msg info' }, 'Compare: ouça o modelo e depois a sua voz. Ficou igual?'),

      h('div', { class: 'actions' }, btn('Ficou igual', function () { pass(h('div', null, q.en)); }, 'primary'), tries >= 2 ? skip() : null));
  }

    if (SRC()) { live = true; mic.classList.add('live'); mic.replaceChildren(ico('stop', 40)); lab.textContent = 'Ouvindo... fale agora'; rec = listen(function (t) { heard.textContent = t; }, onSR, [q.en]); }
    else if (canRecord()) { live = true; mic.classList.add('live'); mic.replaceChildren(ico('stop', 40)); lab.textContent = 'Gravando... toque para parar'; rec = record(onRec); }

QV.speak = function (q, c) { speakLike(q, c, false); };
QV.say = function (q, c) { speakLike(q, c, true); };

/* ===== motor do treino ===== */
function play(qs, o) {
  qs = qs.filter(Boolean);
  if (!qs.length) { show(o.title || 'Treino', o.back, card(h('p', null, 'Não há perguntas suficientes aqui.'))); return; }
  var R = { q: qs.map(function (q) { return { q: q, retry: false, soft: false }; }), total: qs.length, first: 0 };
  function draw() {
    if (!R.q.length) return end();

    var box = h('div', { class: 'card' }, head);

      else {

        else { if (!cur.retry) R.first++; hardOk(q.en); }
      }

      var again = !ok || (soft && cur.soft && R.q.indexOf(cur) >= 0);
      var nb = h('button', { type: 'button', onclick: draw }, R.q.length ? 'Continuar' : 'Ver resultado');
      var sheet = h('div', { class: 'sheet ' + (ok ? 'ok' : 'bad'), role: 'status' }, h('div', null,
        h('div', { class: 'st' }, ico(ok ? 'check' : 'x', 20), ok ? (again ? 'Certo, mas vamos repetir' : ['Muito bem!', 'Certo!', 'Isso mesmo!'][Math.floor(Math.random() * 3)]) : 'Ainda não'),
        fb ? h('div', { class: 'sb' }, fb) : null,
        again ? h('div', { class: 'small', style: 'margin-top:6px' }, ok ? 'Você precisou de dica ou de várias tentativas. Ela volta no fim.' : 'Essa volta daqui a pouco.') : null, nb));
      $app.append(sheet);
      $app.style.paddingBottom = (sheet.offsetHeight + 24) + 'px';
      setTimeout(function () { try { nb.focus({ preventScroll: true }); } catch (e) {} }, 60);
    } };
    show(o.title || 'Treino', o.back, box); document.body.classList.add('playing'); QV[q.t](q, ctx);
  }
  function end() {
    var pct = R.first / R.total, ok = !o.livre && pct >= o.thr;
    if (o.fim) o.fim(ok);
    show(o.title || 'Treino', o.back, card(h('div', { class: 'center' }, ring(pct, { big: true, color: ok || o.livre ? 'var(--ok)' : 'var(--pri)' }),
      h('h2', null, o.livre ? 'Treino concluído' : ok ? (o.nota ? 'Rodada concluída' : 'Etapa concluída') : 'Quase lá'),
      h('p', null, 'Você acertou ' + R.first + ' de ' + R.total + ' de primeira.')),
      h('div', { class: 'msg ' + (ok || o.livre ? 'ok' : 'info') }, o.livre ? 'O que você errou ficou na lista "O que errei".' : ok ? (o.nota || 'Muito bem! A etapa está marcada como feita.') : 'Para concluir, acerte pelo menos ' + Math.ceil(o.thr * R.total) + ' de primeira. Faça outra rodada.'),
      doneCount() > 0 && (!S.bk || Date.now() - S.bk > 2 * 864e5) ? h('div', { class: 'msg warn' }, h('div', null, 'Faz tempo que você não salva uma cópia do progresso.'), h('div', { class: 'actions' }, btn('Salvar cópia agora', function () { exportar(function () { go(o.back); }); }))) : null,
      h('div', { class: 'actions' }, btn(ok ? 'Voltar para a unidade' : 'Outra rodada', ok ? function () { go(o.back); } : o.again, 'primary'), btn(ok ? 'Outra rodada' : 'Voltar', ok ? o.again : function () { go(o.back); }))));
  }
  draw();
}

/* ===== progresso ===== */
function viewPerfil() {
  var tot = 0, fin = 0; BOOKS.forEach(function (b) { b.units.forEach(function (u) { var p = progOf(u); tot++; if (p[0] === p[1]) fin++; }); });
  var nd = Object.keys(S.dif).length, info = h('div'), file = h('input', { type: 'file', style: 'display:none', onchange: function () { if (file.files[0]) importar(file.files[0], function (ok) { if (ok) viewPerfil(); }); } });
  function persist() { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(function (g) { info.replaceChildren(h('p', { class: 'small', style: 'margin-top:10px' }, g ? 'O navegador prometeu guardar os dados deste site.' : 'O navegador não prometeu guardar os dados. Por isso salve a cópia.')); }); }
  var vel = h('select', { 'aria-label': 'Velocidade da voz', onchange: function () { S.cfg.vel = +vel.value; save(); speak('This is the speed of the voice.'); } });

  vel.value = ['1', '0.85', '0.7', '0.55'].reduce(function (a, b) { return Math.abs(+b - S.cfg.vel) < Math.abs(+a - S.cfg.vel) ? b : a; });

    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code.value).then(ok, function () { cmsg.replaceChildren(h('div', { class: 'msg warn' }, 'Não consegui copiar sozinho. Segure o dedo no texto, escolha Selecionar tudo e copie.')); });
    else { try { document.execCommand('copy'); ok(); } catch (e) { cmsg.replaceChildren(h('div', { class: 'msg warn' }, 'Selecione o texto e copie.')); } }

  show('Meu progresso', '',
    h('div', { class: 'card center' }, ring(tot ? fin / tot : 0, { big: true }), h('h2', null, fin + ' de ' + tot + ' unidades concluídas'), h('p', { class: 'small', style: 'margin:0' }, doneCount() + ' etapas feitas no total.')),
    card(h('h3', null, 'Salvar e importar'),
      h('p', null, 'O navegador do celular pode apagar os dados sem avisar. O app guarda o progresso duas vezes no navegador, mas só a cópia em arquivo é segura de verdade. Salve uma vez por semana e guarde no Google Drive, no WhatsApp ou num e-mail para você.'),
      h('p', { class: 'small' }, bk), NOSTORE ? h('div', { class: 'msg warn', style: 'margin:0 0 10px' }, 'Este navegador não está guardando nada agora. Salve a cópia ao terminar.') : null,
      h('button', { type: 'button', class: 'primary wide', onclick: function () { baixar(viewPerfil); } }, 'Baixar arquivo de progresso'),
      h('div', { class: 'actions' }, canShareFile() ? btn('Compartilhar (Drive, WhatsApp)', function () { compartilhar(viewPerfil); }) : null, btn('Importar arquivo', function () { file.click(); })),
      h('h3', null, 'Código de segurança'),
      h('p', { class: 'small' }, 'Se o arquivo não abrir no seu celular, use o código: é um texto só, que você manda para si mesmo e cola depois.'),
      code, h('div', { class: 'actions' }, btn('Copiar código', copiar), btn('Importar código', function () { importText(code.value, function (ok) { if (ok) viewPerfil(); }); })), cmsg,
      h('div', { class: 'actions' }, btn('Pedir ao navegador para guardar', persist)), file, info),
    card(h('h3', null, 'Voz e microfone'), h('p', { class: 'small' }, 'Velocidade da voz em inglês:'), vel,
      !('speechSynthesis' in window) ? h('div', { class: 'msg warn' }, 'Este navegador não tem voz. Use o Chrome.') : !voice ? h('div', { class: 'msg warn' }, 'Não achei uma voz em inglês. No Android, instale o "Reconhecimento e síntese de fala" do Google; no Windows, adicione o idioma inglês.') : h('p', { class: 'small', style: 'margin:10px 0 0' }, 'Voz em uso: ' + voice.name + '.'),
      h('p', { class: 'small', style: 'margin:8px 0 0' }, SRC() ? 'Conferência da fala: automática (precisa de internet e do microfone liberado).' : canRecord() ? 'Conferência da fala: por gravação (você compara com o modelo). No Chrome ela é automática.' : 'Conferência da fala: indisponível neste navegador. Use o Chrome.')),
    card(h('h3', null, 'Calibração do microfone'), h('p', { class: 'small' }, 'O microfone do navegador erra mais a vogal de uma palavra solta (bread vira brad, ham vira him). O app já aceita isso como "quase". Quando ele errar outra coisa e você tiver certeza de que falou certo, toque em "O microfone errou, eu falei certo": o app aprende e passa a aceitar.'), h('p', null, calCount() ? calCount() + ' correção(ões) aprendida(s) neste aparelho.' : 'Nenhuma correção aprendida ainda.'), calCount() ? btn('Apagar as correções', function () { if (confirm('Apagar as correções do microfone?')) { S.cal = {}; save(); viewPerfil(); } }) : null),
    card(h('h3', null, 'Reforço'), h('p', null, nd ? nd + ' item(ns) que você errou e ainda não acertou de novo.' : 'Nada para reforçar agora.'), nd ? btn('Treinar o que errei', playHard, 'primary') : null),
    card(h('h3', null, 'Zerar tudo'), h('p', { class: 'small' }, 'Apaga o progresso deste aparelho. Salve uma cópia antes.'), btn('Apagar progresso', function () { if (confirm('Apagar TODO o progresso deste aparelho? Isso não dá para desfazer.')) { S = fresh(); save(); go('#'); } })));
}

/* ===== rota ===== */
function route() {
  quiet();
  var p = (location.hash || '#').slice(1).split('/');
  if (p[0] === 'u') { var u = UNITS[decodeURIComponent(p[1] || '')]; if (u) return p[2] ? viewStep(u, p[2]) : viewUnit(u); }
  if (p[0] === 'p') return viewPerfil();
  if (p[0] === 'f') return viewFalar();
  viewHome();
}
function start() {
  document.body.classList.remove('locked');
  try { loadBooks(); } catch (e) { $app.textContent = 'Erro ao ler os dados: ' + e.message; return; }
  if (!BOOKS.length) { $app.textContent = 'Nenhum livro encontrado na pasta dados.'; return; }
  S = loadState();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if (doneCount() === 0) { idbGet(function (t) { try { var o = t && clean(JSON.parse(t)), n = 0; if (o) { Object.keys(o.prog).forEach(function (k) { n += Object.keys(o.prog[k].steps).length; }); if (n > 0) { S = o; RESTORED = n; save(); route(); } } } catch (e) {} }); }
  save();
  $tabP.onclick = function () { go('#p'); }; $tabF.onclick = function () { go('#f'); }; $tabH.onclick = function () { go('#'); };
  window.addEventListener('hashchange', route);
  document.addEventListener('visibilitychange', function () { if (document.hidden) save(); });
  route();
}

/* ===== trava (só na versão publicada): o conteúdo vem cifrado e a senha abre ===== */
function b64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
function normPw(s) { return String(s).toLowerCase().replace(/[^a-z0-9]/g, ''); }

  var C = window.__CIFRADO, sub = window.crypto && window.crypto.subtle;
  if (!sub) return Promise.reject(new Error('sem-crypto'));
  return sub.importKey('raw', new TextEncoder().encode(normPw(pw)), 'PBKDF2', false, ['deriveKey'])
    .then(function (k) { return sub.deriveKey({ name: 'PBKDF2', salt: b64(C.s), iterations: C.n, hash: 'SHA-256' }, k, { name: 'AES-GCM', length: 256 }, false, ['decrypt']); })
    .then(function (k) { return sub.decrypt({ name: 'AES-GCM', iv: b64(C.i) }, k, b64(C.c)); })
    .then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
}
function abrir(pw) {
  return decifrar(pw).then(function (d) {
    window.__DADOS = d; try { localStorage.setItem('estudo_k', normPw(pw)); } catch (e) {} start();
  });
}
function trava(erro) {
  document.body.classList.add('locked');
  var input = h('input', { type: 'password', autocomplete: 'current-password', autocapitalize: 'off', spellcheck: 'false', 'aria-label': 'Senha de acesso', placeholder: 'Senha de acesso' }), msg = h('div');
  var go1 = h('button', { type: 'button', class: 'primary wide', style: 'margin-top:12px' }, 'Entrar');
  function enviar() {
    if (!input.value) return; go1.disabled = true; go1.textContent = 'Abrindo...'; msg.replaceChildren();
    abrir(input.value).catch(function (e) {
      go1.disabled = false; go1.textContent = 'Entrar';
      msg.replaceChildren(h('div', { class: 'msg bad' }, e && e.message === 'sem-crypto' ? 'Este navegador não consegue abrir o conteúdo protegido. Abra o endereço com https, no Chrome.' : 'Senha incorreta. Confira e tente de novo.'));
    });
  }
  go1.onclick = enviar; input.addEventListener('keydown', function (e) { if (e.key === 'Enter') enviar(); });
  show('Estudo de inglês', '', h('div', { class: 'card', style: 'margin-top:24px' }, h('h2', null, 'Acesso protegido'),
    h('p', { class: 'mut' }, 'O conteúdo do livro é protegido. Digite a senha de acesso. Ela fica guardada neste aparelho, então você só digita uma vez.'), input, go1, msg, erro ? h('div', { class: 'msg warn' }, erro) : null));
}
if (window.__CIFRADO && !window.__DADOS) {
  var guardada = null; try { guardada = localStorage.getItem('estudo_k'); } catch (e) {}
  if (guardada) abrir(guardada).catch(function () { trava(); }); else trava();

})();
